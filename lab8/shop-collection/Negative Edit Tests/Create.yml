info:
  name: Create
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/api/addproduct"
  body:
    type: json
    data: |-
      {
        "id": "{{$randomInt}}",
        "category_id": 5,
        "title": "Valid Base Product",
        "alias": "",
        "content": "Valid content",
        "price": 1000,
        "old_price": 0,
        "status": 1,
        "keywords": "valid",
        "description": "valid",
        "hit": 1
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        let actualStatus = res.getStatus();
        let body = res.getBody();

        test("Base product created successfully", function() {
            expect(actualStatus, "Failed to create base product for edit test").to.be.oneOf([200, 201]);
        });

        if ((actualStatus === 200 || actualStatus === 201) && body && body.id) {
            bru.setVar("created_product_id", body.id);
        } else {
            bru.setNextRequest(null);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

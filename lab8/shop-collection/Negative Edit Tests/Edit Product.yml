info:
  name: Edit Product
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/api/editproduct"
  body:
    type: json
    data: |-
      {
        "id": "{{created_product_id}}",
        "category_id": "{{category_id}}",
        "title": "{{title}}",
        "content": "Edited content",
        "price": "{{price}}",
        "old_price": "{{old_price}}",
        "status": "{{status}}",
        "keywords": "edited",
        "description": "edited",
        "hit": "{{hit}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        let expectedStatus = bru.getVar("expected_status");
        let testName = bru.getVar("test_name");
        let actualStatus = res.getStatus();

        test(testName, function() {
            expect(actualStatus, `Test Failed. Expected ${expectedStatus}, got ${actualStatus}`).to.equal(expectedStatus);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
